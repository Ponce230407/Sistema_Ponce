<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Contacta a Patitas con Hogar para conocer adopciones, voluntariado y formas de ayudar."><meta name="theme-color" content="#fff8ef"><title>Contacto y ubicación | Patitas con Hogar"><style>:root{--ink:#28352e;--muted:#66736a;--cream:#fff8ef;--paper:#fff;--green:#365b45;--green-dark:#244331;--orange:#ef9c55;--line:#e9e3d9;--soft:#f4eee4;--shadow:0 12px 36px rgba(38,56,44,.12)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6}.wrap{width:min(100% - 40px,1040px);margin:auto}.hero{padding:60px 0 30px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}.hero h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.1;color:var(--green-dark);margin:12px 0}.hero p{max-width:720px;color:var(--muted);font-size:1.08rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding:12px 0 60px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}.card h2{margin-top:0;color:var(--green-dark)}.button{display:inline-block;background:var(--green);color:#fff;text-decoration:none;padding:11px 16px;border-radius:10px;font-weight:700}.small{color:var(--muted);font-size:.9rem}footer{padding:20px 0;background:var(--soft);color:var(--muted)}@media(max-width:520px){.wrap{width:calc(100% - 28px)}.hero{padding-top:38px}}</style></head><body><div id="nav-placeholder"></div><main class="wrap"><section class="hero"><span class="eyebrow">Estamos para ayudarte</span><h1>Hablemos de cómo cambiar una vida.</h1><p>¿Te interesa adoptar, ofrecer un hogar temporal o colaborar? Escríbenos para conocer los pasos y la información actualizada del refugio.</p></section><div class="grid"><section class="card"><h2>🤝 Adopciones y voluntariado</h2><p>Regístrate para conocer las oportunidades de voluntariado y recibir orientación sobre adopciones.</p><a class="button" href="/LOGIN/registro.php">Crear cuenta</a></section><section class="card"><h2>💛 Donaciones</h2><p>Consulta los datos para realizar una transferencia o depósito a favor del refugio.</p><a class="button" href="/Foto/public/donaciones.html">Ver datos de donación</a></section><section class="card"><h2>📍 Visitas al refugio</h2><p>La dirección y los horarios se coordinan directamente con el equipo para cuidar la seguridad y bienestar de los perros.</p><p class="small">Confirma los detalles antes de visitarnos.</p><a class="button" href="/Foto/public/index.html">Conocer la fundación</a></section></div></main><footer><div class="wrap">Patitas con Hogar · Gracias por apoyar la adopción responsable.</div></footer><script>fetch('/Foto/public/nav.html').then(r=>r.text()).then(html=>document.getElementById('nav-placeholder').innerHTML=html).catch(()=>{});</script><script src="/Seguir/tracker.js"></script></body></html>
