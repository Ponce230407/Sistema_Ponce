<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Cuéntanos qué podemos mejorar para ayudar a los perros rescatados."><title>Encuesta | Patitas con Hogar</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="container"><div id="nav-placeholder"></div><header class="header-profile"><div class="profile-img" aria-hidden="true">🐾</div><h1 class="title">Ayúdanos a cuidar mejor</h1><p>Tu opinión nos ayuda a crear un refugio más amable para cada perrito.</p></header>
<form action="procesar_encuesta.php" method="POST">
<div class="form-group"><label for="nombre_completo">Tu nombre</label><input id="nombre_completo" name="nombre_completo" type="text" autocomplete="name" maxlength="150" required></div>
<div class="form-group"><label for="p1">1. ¿Cómo conociste nuestra labor?</label><select id="p1" name="p1_profesores" required><option value="">Selecciona una opción</option><option value="Redes sociales">Redes sociales</option><option value="Recomendación">Recomendación de alguien</option><option value="Evento comunitario">Evento comunitario</option><option value="Búsqueda en internet">Búsqueda en internet</option></select></div>
<div class="form-group"><label for="p2">2. ¿Cómo te gustaría ayudar?</label><select id="p2" name="p2_alumnos" required><option value="">Selecciona una opción</option><option value="Voluntariado">Ser voluntario/a</option><option value="Donación de alimento">Donar alimento o artículos</option><option value="Hogar temporal">Ofrecer hogar temporal</option><option value="Adopción responsable">Adoptar responsablemente</option></select></div>
<div class="form-group"><label for="p3">3. ¿Qué tema te gustaría conocer mejor?</label><select id="p3" name="p3_instalaciones" required><option value="">Selecciona una opción</option><option value="Adopción responsable">Adopción responsable</option><option value="Bienestar animal">Bienestar y cuidados</option><option value="Tenencia responsable">Tenencia responsable</option><option value="Voluntariado">Voluntariado en el refugio</option></select></div>

<div class="form-group"><label for="p5">5. ¿Qué consideras más importante al adoptar?</label><select id="p5" name="p5_comida" required><option value="">Selecciona una opción</option><option value="Compromiso de por vida">Compromiso para toda su vida</option><option value="Tiempo y paciencia">Tiempo y paciencia</option><option value="Cuidados veterinarios">Cuidados veterinarios</option><option value="Espacio y convivencia">Un espacio seguro y buena convivencia</option></select></div>
<button type="submit" class="btn-submit">Enviar mi opinión 🐾</button></form></main>
