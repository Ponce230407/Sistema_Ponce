<!DOCTYPE html>
<html lang="es">
<head>
 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias! - Regalo UPVM</title>   
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    header {
      background: #2c3e50;
      color: #fff;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .header-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #3498db;
    }
    .gift-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }
    .gift-icon {
      font-size: 80px;
      margin: 20px 0;
    }
    .coupon {
      background-color: #e8f8f5;
      border: 2px dashed #2ecc71;
      padding: 15px;
      border-radius: 8px;
      font-weight: bold;
      color: #27ae60;
      display: inline-block;
      margin: 15px 0;
    }
    .btn {
      display: inline-block;
      background-color: #3498db;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Encabezado con foto (Requisito 1) -->
  <header>
    <img src="foto.jpg" alt="Fotografía de Itzel" class="header-img">
    <h1>¡Gracias por responder!</h1>
  </header>

  <main class="gift-container">
    <h2>¡Aquí tienes tu regalo! 🎁</h2>
    <div class="gift-icon">🎉🎁🎈</div>
    <p>Gracias por responder tú unico regalo serán esos emojis</p>
    
    <div class="Amigo">
      Andale ve con tú amigo a que te de un abrazo
    </div>
    
    <p><small>Para que dejes de andar buscando regalos</small></p>
    
    <br>
    <a href="index.html" class="btn">Volver al Inicio</a>
  </main>

  <script src="/Seguir/tracker.js"></script>
</body>
</html>
