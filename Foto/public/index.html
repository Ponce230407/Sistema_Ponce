<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitio Web Personal - Itzel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <div id="nav-placeholder"></div>

    <section class="hero-card">
      <div class="profile-top">
        <img src="foto.jpg" alt="Fotografía de Itzel" class="profile-img">
      </div>

      <div class="hero-copy">
        <p class="eyebrow">Bienvenidos</p>
        <h1>Itzel</h1>
        <p class="career"><strong>Carrera:</strong> Licenciatura en Información e Innovación Digital</p>
        <p class="description">
          Bienvenido a mi sitio web. Ayúdame respondiendo una breve encuesta sobre la UPVM y conoce más sobre mi proyecto.
        </p>
      </div>

      <div class="actions">
        <a href="encuesta.html" class="btn btn-primary">Ir a la encuesta</a>
        <a href="#video" class="btn btn-secondary">Ver video</a>
      </div>
    </section>

    <section id="video" class="video-section">
      <div class="video-header">
        <span class="video-badge">Video</span>
        <h2>Conoce más</h2>
      </div>
      <div class="video-frame">
        <video controls preload="metadata" playsinline>
          <source src="../../Video.mp4" type="video/mp4">
          Tu navegador no soporta la reproducción de video.
        </video>
      </div>
    </section>
  </main>

  <script>
    fetch('nav.html')
      .then(res => res.text())
      .then(data => document.getElementById('nav-placeholder').innerHTML = data);
  </script>
  <script src="/Seguir/tracker.js"></script>
</body>
</html>
