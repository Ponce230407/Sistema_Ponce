<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta UPVM</title>
  <style>
    :root {
      --bg-sky-1: #b7c7f8;
      --bg-sky-2: #a7b9eb;
      --panel-bg: rgba(255, 255, 255, 0.78);
      --card-light: #f3f3f3;
      --text: #1f2b3d;
      --muted: #44516a;
      --primary: #dfe9f7;
      --primary-dark: #c7d6ef;
      --shadow: rgba(30, 41, 59, 0.18);
      --button: rgba(215, 224, 238, 0.95);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--bg-sky-1), var(--bg-sky-2));
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 18px 50px;
    }

    .page-shell {
      width: min(780px, 100%);
      background: rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      box-shadow: 0 20px 35px rgba(26, 39, 63, 0.12);
      overflow: hidden;
    }

    .browser-window {
      background: #f1f1f1;
      border-radius: 18px 18px 0 0;
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.08);
    }

    .browser-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px 8px;
      background: rgba(255, 255, 255, 0.55);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    .browser-left,
    .browser-right,
    .nav-icons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn,
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .nav-btn {
      background: #d6d6d6;
      position: relative;
    }

    .nav-btn.arrow {
      width: 9px;
      height: 9px;
      border: solid #6e6e6e;
      border-width: 0 2px 2px 0;
      border-radius: 0;
      transform: rotate(135deg);
      background: transparent;
    }

    .dot.red { background: #f46d5f; }
    .dot.yellow { background: #f0c14f; }
    .dot.green { background: #5bc96d; }

    .browser-title {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #4e5f73;
      gap: 6px;
      padding: 0 12px;
    }

    .address-bar {
      width: min(580px, 90%);
      background: #f8f8f8;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px 12px;
      font-size: 12px;
      color: #5a6477;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .browser-right {
      font-size: 14px;
      color: #697489;
    }

    .top-nav {
      background: rgba(18, 30, 45, 0.9);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .nav-brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-decoration: none;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-link {
      color: #e5eefc;
      text-decoration: none;
      font-size: 0.92rem;
      padding: 7px 10px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .nav-link:hover {
      background: rgba(255,255,255,0.08);
    }

    .page-panel {
      background: rgba(238, 239, 242, 0.92);
      padding: 26px 20px 20px;
      border-radius: 0 0 18px 18px;
    }

    .profile-card {
      max-width: 650px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      text-align: center;
      padding: 14px 20px 18px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 18px rgba(62, 73, 96, 0.12);
      display: block;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #1f2b3d;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 1.05rem;
      color: #2b3a52;
      font-weight: 500;
    }

    .welcome-panel {
      max-width: 650px;
      margin: 28px auto 0;
      background: rgba(245, 246, 247, 0.9);
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.2);
      padding: 18px 18px 20px;
      text-align: left;
    }

    .welcome-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .welcome-title {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 2rem);
      font-weight: 700;
      color: #1f2b3d;
    }

    .mini-icon {
      font-size: 20px;
      opacity: 0.8;
    }

    .welcome-text {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.5;
      color: #2b3a52;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: var(--button);
      color: #23314d;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: inset 0 0 0 1px rgba(80, 97, 125, 0.14);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: #d2ddeb;
    }

    .btn-primary {
      background: #dfe9f5;
    }

    .btn-secondary {
      background: #dde5f5;
    }

    .video-section {
      max-width: 650px;
      margin: 22px auto 0;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 14px 14px 10px;
    }

    .video-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #1f2b3d;
    }

    .video-badge {
      display: inline-block;
      background: rgba(255,255,255,0.36);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .video-head h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .video-frame {
      background: rgba(255,255,255,0.22);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.2);
    }

    video {
      display: block;
      width: 100%;
      max-height: 260px;
      background: #111827;
    }

    @media (max-width: 560px) {
      body { padding: 18px 12px 28px; }
      .page-panel { padding: 18px 12px 14px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
      .address-bar { font-size: 11px; }
      .top-nav { flex-direction: column; align-items: flex-start; }
      .nav-menu { width: 100%; }
    }
  </style>
</head>
<body>

    </div>

    <nav class="top-nav" aria-label="Navegación principal">

    </nav>

    <div class="page-panel">

      </div>

      <div class="welcome-panel">

        <div class="video-frame">

  </main>

  <script src="/Seguir/tracker.js"></script>

</html>
