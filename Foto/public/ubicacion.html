<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ubicación - Itzel</title>
  <style>
    :root {
      --bg: #f3f3f3;
      --panel: #ffffff;
      --panel-soft: #f7f7f7;
      --text: #2c3a4d;
      --muted: #5a6779;
      --line: rgba(16, 24, 40, 0.08);
      --blue: #1f78ff;
      --blue-strong: #0d5ed7;
      --shadow: rgba(17, 24, 39, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px 0 30px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 12px;
    }

    .profile {
      text-align: center;
      padding: 8px 0 18px;
    }

    .profile-photo {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 0 auto 12px;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      background: #e5e7eb;
    }

    .profile h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: #2a3747;
    }

    .profile .career {
      margin-top: 8px;
      font-size: 0.83rem;
      color: #6a7280;
      line-height: 1.5;
    }

    .profile .career strong {
      font-weight: 600;
      color: #4a576b;
    }

    .map-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(10, 10, 10, 0.03);
    }

    .browser-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      height: 48px;
      background: #f5f5f5;
      border-bottom: 1px solid var(--line);
      padding: 0 12px;
    }

    .browser-left,
    .browser-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 110px;
    }

    .browser-right {
      justify-content: flex-end;
    }

    .dot,
    .nav-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.red { background: #f46b5f; }
    .dot.yellow { background: #f3c54b; }
    .dot.green { background: #68c76d; }

    .nav-btn {
      background: #d8d8d8;
      position: relative;
      width: 10px;
      height: 10px;
    }

    .nav-btn.arrow {
      background: transparent;
      width: 8px;
      height: 8px;
      border: solid #7a7a7a;
      border-width: 0 2px 2px 0;
      transform: rotate(135deg);
      border-radius: 0;
    }

    .browser-middle {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .address-bar {
      width: min(100%, 520px);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      color: #5d6775;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-frame {
      position: relative;
      width: 100%;
      height: 420px;
      background: #c7d6d4;
    }

    #mapa-js {
      width: 100%;
      height: 100%;
      min-height: 420px;
      background: #dfe7e7;
    }

    .map-status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #4b5a6b;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.2);
      letter-spacing: 0.02em;
      z-index: 2;
      pointer-events: none;
    }

    .map-status.hidden {
      display: none;
    }

    .map-footer {
      padding-top: 12px;
      text-align: left;
      font-size: 0.8rem;
      color: #6b7280;
    }

    @media (max-width: 640px) {
      .browser-left,
      .browser-right {
        min-width: auto;
      }

      .browser-bar {
        gap: 6px;
      }

      .address-bar {
        font-size: 11px;
        padding: 7px 10px;
      }

      .map-frame,
      #mapa-js {
        height: 300px;
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">
      <img src="foto.jpg" alt="Itzel" class="profile-photo" />
      <h2>Itzel</h2>
      <div class="career">
        <strong>Carrera:</strong> Licenciatura en Informática en Innovación Digital<br />
        <strong>Estudiante:</strong> que gustan las redes y las bases de datos.
      </div>
    </div>

    <div class="map-card">
      <div class="browser-bar">
        <div class="browser-left">
          <span class="nav-btn arrow" aria-hidden="true"></span>
          <span class="nav-btn" aria-hidden="true"></span>
          <span class="nav-btn" aria-hidden="true"></span>
        </div>

        <div class="browser-middle">
          <div class="address-bar">sitio-web-ponce.onrender.com/ubicacion</div>
        </div>

        <div class="browser-right">
          <span class="dot red" aria-hidden="true"></span>
          <span class="dot yellow" aria-hidden="true"></span>
          <span class="dot green" aria-hidden="true"></span>
        </div>
      </div>

      <div class="map-frame">
        <div id="mapa-js" aria-label="Mapa de ubicación"></div>
        <div id="map-status" class="map-status">Cargando mapa...</div>
      </div>
    </div>
  </div>

  <script>
    const MAP_CONFIG = {
      apiKey: 'TU_API_KEY_DE_GOOGLE_MAPS',
      location: { lat: 19.609053, lng: -99.156686 },
      zoom: 15,
      title: 'Itzel'
    };

    function initMap() {
      const map = new google.maps.Map(document.getElementById('mapa-js'), {
        zoom: MAP_CONFIG.zoom,
        center: MAP_CONFIG.location,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true,
        zoomControl: true,
        gestureHandling: 'greedy'
      });

      new google.maps.Marker({
        position: MAP_CONFIG.location,
        map,
        title: MAP_CONFIG.title,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 10,
          fillColor: '#1f78ff',
          fillOpacity: 1,
          strokeColor: '#ffffff',
          strokeWeight: 2
        }
      });

      const status = document.getElementById('map-status');
      if (status) status.classList.add('hidden');
    }

    async function loadMapConfig() {
      try {
        const response = await fetch('maps-config.php');
        if (!response.ok) throw new Error('No se pudo cargar la configuración del mapa.');
        const config = await response.json();

        if (config && config.apiKey && config.apiKey !== 'TU_API_KEY_DE_GOOGLE_MAPS') {
          MAP_CONFIG.apiKey = config.apiKey;
        }

        if (config && config.location) {
          MAP_CONFIG.location = config.location;
        }
      } catch (error) {
        console.warn(error.message || 'Usando clave por defecto.');
      }

      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(MAP_CONFIG.apiKey)}&callback=initMap`;
      script.async = true;
      script.defer = true;
      script.onerror = () => {
        const status = document.getElementById('map-status');
        status.textContent = 'No se pudo cargar Google Maps. Revisa la API key.';
      };
      document.head.appendChild(script);
    }

    loadMapConfig();
  </script>
</body>
</html>
